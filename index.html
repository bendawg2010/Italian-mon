<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brainrot Monsters: Tralalero Edition</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="screen">
      <canvas id="game" width="480" height="320"></canvas>

      <div id="dialog" class="ui-box hidden">
        <div id="dialog-text"></div>
        <div id="dialog-arrow">▼</div>
      </div>

      <div id="menu" class="ui-box hidden">
        <ul id="menu-list"></ul>
      </div>

      <div id="battle-ui" class="hidden">
        <div id="enemy-info" class="mon-info">
          <div class="mon-name"></div>
          <div class="mon-lvl"></div>
          <div class="hp-bar"><div class="hp-fill"></div></div>
        </div>
        <div id="player-info" class="mon-info">
          <div class="mon-name"></div>
          <div class="mon-lvl"></div>
          <div class="hp-bar"><div class="hp-fill"></div></div>
          <div class="hp-text"></div>
          <div class="xp-bar"><div class="xp-fill"></div></div>
        </div>
        <div id="battle-text" class="ui-box"></div>
        <div id="battle-actions" class="ui-box hidden">
          <button data-action="fight">FIGHT</button>
          <button data-action="bag">BAG</button>
          <button data-action="team">TEAM</button>
          <button data-action="run">RUN</button>
        </div>
        <div id="move-list" class="ui-box hidden"></div>
      </div>

      <div id="title-screen">
        <h1>BRAINROT<br/>MONSTERS</h1>
        <p class="subtitle">Tralalero Edition</p>
        <p class="prompt">Press ENTER / Tap to Start</p>
        <p class="credits">A 2026 Italian Brain Rot Adventure</p>
      </div>

      <div id="touch-controls" class="hidden">
        <div class="dpad">
          <button data-key="ArrowUp">▲</button>
          <button data-key="ArrowLeft">◀</button>
          <button data-key="ArrowDown">▼</button>
          <button data-key="ArrowRight">▶</button>
        </div>
        <div class="actions">
          <button data-key="z">A</button>
          <button data-key="x">B</button>
        </div>
      </div>
    </div>
    <div id="hud">
      <span>Z = A · X = B · Arrows = Move · Enter = Start</span>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
