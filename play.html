<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brainrot Monsters: Tralalero Edition</title>
<style>
:root {
  --bg: #0d0d18;
  --panel: #181828;
  --panel-light: #2a2a40;
  --accent: #ffcb05;
  --accent2: #ff4d6d;
  --text: #f4f4f4;
  --shadow: rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 50% 30%, #1b1b3a, #050510 70%);
  color: var(--text);
  font-family: "Courier New", monospace;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px;
  gap: 8px;
}

#screen {
  position: relative;
  width: min(96vw, 960px);
  aspect-ratio: 3 / 2;
  background: #000;
  border: 4px solid #444;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 24px var(--shadow), inset 0 0 0 2px #111;
}

#game {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  background: #2a8c4a;
}

.ui-box {
  position: absolute;
  background: var(--panel);
  border: 3px solid var(--accent);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: clamp(11px, 2vw, 18px);
  line-height: 1.4;
  color: var(--text);
  box-shadow: 0 4px 12px var(--shadow);
  z-index: 10;
}

#dialog {
  left: 4%;
  right: 4%;
  bottom: 4%;
  min-height: 22%;
  white-space: pre-wrap;
}

#dialog-arrow {
  position: absolute;
  right: 14px;
  bottom: 6px;
  color: var(--accent);
  animation: blink 0.8s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

#menu {
  top: 4%;
  right: 4%;
  min-width: 35%;
}
#menu-list { list-style: none; }
#menu-list li {
  padding: 4px 8px;
  cursor: pointer;
}
#menu-list li.selected {
  background: var(--accent);
  color: #000;
  border-radius: 4px;
}

.hidden { display: none !important; }

#battle-ui {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

.mon-info {
  position: absolute;
  background: var(--panel);
  border: 2px solid var(--accent);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: clamp(10px, 1.6vw, 14px);
  min-width: 160px;
  box-shadow: 0 4px 8px var(--shadow);
}
#enemy-info { top: 6%; left: 4%; }
#player-info { bottom: 32%; right: 4%; }
.mon-name { font-weight: bold; }
.mon-lvl { font-size: 0.9em; color: #ffd; }
.hp-bar {
  width: 100%;
  height: 8px;
  background: #333;
  border-radius: 4px;
  margin-top: 4px;
  overflow: hidden;
}
.hp-fill {
  height: 100%;
  background: linear-gradient(90deg, #5cd765, #2ca642);
  width: 100%;
  transition: width 0.3s;
}
.hp-fill.med { background: linear-gradient(90deg, #f9d423, #e2a000); }
.hp-fill.low { background: linear-gradient(90deg, #ff5e5e, #c0392b); }
.hp-text { font-size: 0.8em; text-align: right; }
.xp-bar {
  width: 100%;
  height: 4px;
  background: #222;
  border-radius: 2px;
  margin-top: 2px;
  overflow: hidden;
}
.xp-fill {
  height: 100%;
  background: #4fa9ff;
  width: 0%;
  transition: width 0.3s;
}

#battle-text {
  position: absolute;
  left: 4%;
  right: 4%;
  bottom: 4%;
  height: 24%;
  pointer-events: auto;
}

#battle-actions, #move-list {
  position: absolute;
  right: 4%;
  bottom: 4%;
  width: 50%;
  height: 24%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  pointer-events: auto;
  align-content: center;
}
#battle-actions button, #move-list button {
  background: var(--panel-light);
  border: 2px solid var(--accent);
  color: var(--text);
  font-family: inherit;
  font-size: clamp(11px, 1.8vw, 16px);
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.1s, background 0.1s;
}
#battle-actions button:hover, #move-list button:hover,
#battle-actions button.selected, #move-list button.selected {
  background: var(--accent);
  color: #000;
  transform: translateY(-1px);
}

#title-screen {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 40%, #5b2d8c, #0d0625 80%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 20;
  padding: 20px;
}
#title-screen h1 {
  font-size: clamp(28px, 6vw, 64px);
  letter-spacing: 4px;
  color: var(--accent);
  text-shadow: 4px 4px 0 var(--accent2), 8px 8px 0 #2a0a3a;
  line-height: 0.9;
  margin-bottom: 12px;
  animation: wobble 3s ease-in-out infinite;
}
@keyframes wobble {
  0%,100% { transform: rotate(-2deg); }
  50% { transform: rotate(2deg); }
}
#title-screen .subtitle {
  font-size: clamp(14px, 2.5vw, 22px);
  color: #ffd;
  margin-bottom: 24px;
  font-style: italic;
}
#title-screen .prompt {
  font-size: clamp(12px, 2vw, 18px);
  color: var(--text);
  animation: blink 1s steps(2) infinite;
}
#title-screen .credits {
  margin-top: 32px;
  font-size: clamp(10px, 1.5vw, 13px);
  color: #aab;
}

#hud {
  font-size: 12px;
  color: #aaa;
  text-align: center;
  font-family: "Courier New", monospace;
}

#touch-controls {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 30;
}
.dpad, .actions {
  position: absolute;
  bottom: 8px;
  display: grid;
  gap: 4px;
  pointer-events: auto;
}
.dpad {
  left: 8px;
  grid-template-columns: repeat(3, 40px);
  grid-template-rows: repeat(3, 40px);
}
.dpad button:nth-child(1) { grid-column: 2; grid-row: 1; }
.dpad button:nth-child(2) { grid-column: 1; grid-row: 2; }
.dpad button:nth-child(3) { grid-column: 2; grid-row: 3; }
.dpad button:nth-child(4) { grid-column: 3; grid-row: 2; }

.actions {
  right: 8px;
  grid-template-columns: 50px 50px;
}
#touch-controls button {
  background: rgba(40,40,60,0.85);
  border: 2px solid var(--accent);
  color: var(--text);
  font-size: 18px;
  border-radius: 50%;
  width: 100%;
  height: 100%;
  font-family: inherit;
  cursor: pointer;
}
#touch-controls button:active {
  background: var(--accent);
  color: #000;
}

@media (pointer: coarse) {
  #touch-controls { display: block; }
  #touch-controls.hidden { display: none; }
  #hud { font-size: 10px; }
}

</style>
</head>
<body>
  <div id="app">
    <div id="screen">
      <canvas id="game" width="480" height="320"></canvas>

      <div id="dialog" class="ui-box hidden">
        <div id="dialog-text"></div>
        <div id="dialog-arrow">▼</div>
      </div>

      <div id="menu" class="ui-box hidden">
        <ul id="menu-list"></ul>
      </div>

      <div id="battle-ui" class="hidden">
        <div id="enemy-info" class="mon-info">
          <div class="mon-name"></div>
          <div class="mon-lvl"></div>
          <div class="hp-bar"><div class="hp-fill"></div></div>
        </div>
        <div id="player-info" class="mon-info">
          <div class="mon-name"></div>
          <div class="mon-lvl"></div>
          <div class="hp-bar"><div class="hp-fill"></div></div>
          <div class="hp-text"></div>
          <div class="xp-bar"><div class="xp-fill"></div></div>
        </div>
        <div id="battle-text" class="ui-box"></div>
        <div id="battle-actions" class="ui-box hidden">
          <button data-action="fight">FIGHT</button>
          <button data-action="bag">BAG</button>
          <button data-action="team">TEAM</button>
          <button data-action="run">RUN</button>
        </div>
        <div id="move-list" class="ui-box hidden"></div>
      </div>

      <div id="title-screen">
        <h1>BRAINROT<br/>MONSTERS</h1>
        <p class="subtitle">Tralalero Edition</p>
        <p class="prompt">Press ENTER / Tap to Start</p>
        <p class="credits">A 2026 Italian Brain Rot Adventure</p>
      </div>

      <div id="touch-controls" class="hidden">
        <div class="dpad">
          <button data-key="ArrowUp">▲</button>
          <button data-key="ArrowLeft">◀</button>
          <button data-key="ArrowDown">▼</button>
          <button data-key="ArrowRight">▶</button>
        </div>
        <div class="actions">
          <button data-key="z">A</button>
          <button data-key="x">B</button>
        </div>
      </div>
    </div>
    <div id="hud">
      <span>Z = A · X = B · Arrows = Move · Enter = Start</span>
    </div>
  </div>

// Helpers
function statAt(species, level, stat) {
  // simple stat formula
  const base = species.base[stat];
  return Math.floor(((base * 2) * level) / 100) + (stat === "hp" ? level + 10 : 5);
}

function maxHp(species, level) { return statAt(species, level, "hp"); }

function xpForLevel(level) {
  // medium-fast
  return Math.floor(level * level * level);
}

function makeMon(speciesId, level) {
  const sp = SPECIES[speciesId];
  if (!sp) throw new Error("unknown species " + speciesId);
  const moves = [];
  const entries = (sp.learn || []).slice().sort((a,b) => a[0] - b[0]);
  for (const [lvl, mv] of entries) {
    if (lvl <= level && !moves.includes(mv)) {
      moves.push(mv);
      if (moves.length > 4) moves.shift();
    }
  }
  if (moves.length === 0) moves.push("TACKLE");
  return {
    species: speciesId,
    nickname: sp.name,
    level,
    xp: xpForLevel(level),
    hp: maxHp(sp, level),
    maxHp: maxHp(sp, level),
    moves: moves.map(id => ({ id, pp: MOVES[id].pp, maxPp: MOVES[id].pp })),
    statusEffect: null,
    statBoosts: { atk: 0, def: 0, spd: 0 },
    iv: Math.floor(Math.random()*16),
  };
}

function movesLearnedAt(species, level) {
  return (species.learn || []).filter(([lvl]) => lvl === level).map(([, mv]) => mv);
}

function getStat(mon, stat) {
  const sp = SPECIES[mon.species];
  let v = statAt(sp, mon.level, stat);
  if (stat === "hp") return v;
  const boost = mon.statBoosts[stat] || 0;
  if (boost >= 0) v = Math.floor(v * (2 + boost) / 2);
  else v = Math.floor(v * 2 / (2 - boost));
  return Math.max(1, v);
}

function typeEffectiveness(attackType, defenderTypes) {
  let mult = 1;
  for (const t of defenderTypes) {
    const m = (TYPE_CHART[attackType] || {})[t];
    if (m !== undefined) mult *= m;
  }
  return mult;
}

const SpriteRenderer = (() => {

  // Draw a filled rounded shape made of pixel cells
  function px(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function shadow(ctx, cx, cy, rx, ry) {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Generic monster body builder, parameterized by species color1/2/3 and shape kind
  // Each species gets a stable shape based on its id hash
  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  // Specialized sprite functions per species
  const SPECIAL = {
    TRALALERO(ctx, sp, x, y, s, t) {
      // Shark body with three legs and Nikes
      const bob = Math.sin(t * 0.005) * 1;
      shadow(ctx, x + s/2, y + s - 4, s*0.4, 4);
      // body
      px(ctx, x+s*0.15, y+s*0.30+bob, s*0.7, s*0.4, sp.color1);
      // belly
      px(ctx, x+s*0.20, y+s*0.50+bob, s*0.6, s*0.20, sp.color2);
      // tail
      px(ctx, x+s*0.05, y+s*0.30+bob, s*0.10, s*0.30, sp.color1);
      px(ctx, x+s*0.00, y+s*0.20+bob, s*0.10, s*0.15, sp.color1);
      px(ctx, x+s*0.00, y+s*0.55+bob, s*0.10, s*0.15, sp.color1);
      // eye
      px(ctx, x+s*0.70, y+s*0.36+bob, s*0.10, s*0.10, "#fff");
      px(ctx, x+s*0.74, y+s*0.40+bob, s*0.05, s*0.05, "#000");
      // mouth (sharp)
      px(ctx, x+s*0.80, y+s*0.50+bob, s*0.10, s*0.04, "#000");
      px(ctx, x+s*0.82, y+s*0.46+bob, s*0.02, s*0.04, "#fff");
      px(ctx, x+s*0.85, y+s*0.46+bob, s*0.02, s*0.04, "#fff");
      // nikes (3 shoes)
      for (let i = 0; i < 3; i++) {
        const lx = x+s*(0.25 + i*0.20);
        px(ctx, lx, y+s*0.70+bob, s*0.10, s*0.10, "#000");
        px(ctx, lx-s*0.02, y+s*0.78+bob, s*0.16, s*0.06, sp.color3);

    SKIBIDI(ctx, sp, x, y, s, t) {

      shadow(ctx, x + s/2, y + s - 4, s*0.4, 4);
      // toilet base

    GLORBO(ctx, sp, x, y, s, t) {
      const bob = Math.sin(t * 0.008) * 2;
      const wob = Math.sin(t * 0.01) * 0.05;
      shadow(ctx, x + s/2, y + s - 4, s*0.3, 4);
      // glowing aura
      ctx.fillStyle = sp.color2;
      ctx.globalAlpha = 0.3;
      ctx.beginPath();
      ctx.arc(x+s*0.5, y+s*0.5+bob, s*0.45, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
      // blob
      px(ctx, x+s*(0.30-wob), y+s*0.30+bob, s*(0.40+wob*2), s*0.50, sp.color1);
      px(ctx, x+s*0.20, y+s*0.40+bob, s*0.60, s*0.30, sp.color1);
      // eyes (multiple)
      for (let i = 0; i < 3; i++) {
        px(ctx, x+s*(0.30+i*0.18), y+s*(0.40+(i%2)*0.10)+bob, s*0.06, s*0.06, "#fff");

    SIGMAWOLF(ctx, sp, x, y, s, t) {

      px(ctx, x+s*0.74, y+s*0.40+bob, s*0.06, s*0.06, sp.color2);
      // snout
      px(ctx, x+s*0.78, y+s*0.46+bob, s*0.10, s*0.10, sp.color3);
      // legs
      px(ctx, x+s*0.25, y+s*0.72+bob, s*0.08, s*0.15, sp.color1);
      px(ctx, x+s*0.40, y+s*0.72+bob, s*0.08, s*0.15, sp.color1);
      px(ctx, x+s*0.55, y+s*0.72+bob, s*0.08, s*0.15, sp.color1);

    },
    RIZZLER(ctx, sp, x, y, s, t) {
      const bob = Math.sin(t * 0.005) * 1;
      shadow(ctx, x + s/2, y + s - 4, s*0.3, 4);
      // body humanoid
      px(ctx, x+s*0.35, y+s*0.40+bob, s*0.30, s*0.40, sp.color2);
      // head
      px(ctx, x+s*0.30, y+s*0.18+bob, s*0.40, s*0.25, sp.color1);
      // tiny hat
      px(ctx, x+s*0.34, y+s*0.10+bob, s*0.32, s*0.06, sp.color3);
      px(ctx, x+s*0.40, y+s*0.05+bob, s*0.20, s*0.06, sp.color3);
      // eyes (smolder)
      px(ctx, x+s*0.36, y+s*0.26+bob, s*0.08, s*0.04, "#000");
      px(ctx, x+s*0.56, y+s*0.26+bob, s*0.08, s*0.04, "#000");
      // smirk
      px(ctx, x+s*0.42, y+s*0.34+bob, s*0.16, s*0.03, "#000");
      // arms
      px(ctx, x+s*0.20, y+s*0.45+bob, s*0.15, s*0.05, sp.color1);
      px(ctx, x+s*0.65, y+s*0.45+bob, s*0.15, s*0.05, sp.color1);
      // legs
      px(ctx, x+s*0.38, y+s*0.78+bob, s*0.08, s*0.15, sp.color2);
      px(ctx, x+s*0.54, y+s*0.78+bob, s*0.08, s*0.15, sp.color2);
    },
    OHIO(ctx, sp, x, y, s, t) {
      const bob = Math.sin(t * 0.01) * 3;
      shadow(ctx, x + s/2, y + s - 4, s*0.4, 4);
      // chaotic mass
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2 + t*0.001;
        const cx = x + s*0.5 + Math.cos(ang) * s * 0.30;
        const cy = y + s*0.5 + Math.sin(ang) * s * 0.30 + bob;
        const c = [sp.color1, sp.color2, sp.color3][i % 3];
        px(ctx, cx, cy, s*0.10, s*0.10, c);
      }
      // central eye
      px(ctx, x+s*0.40, y+s*0.40+bob, s*0.20, s*0.20, "#fff");
      px(ctx, x+s*0.45, y+s*0.45+bob, s*0.10, s*0.10, "#000");
      px(ctx, x+s*0.47, y+s*0.47+bob, s*0.04, s*0.04, sp.color3);

    LASAGNINI(ctx, sp, x, y, s, t) {
      const bob = Math.sin(t * 0.004) * 1;
      shadow(ctx, x + s/2, y + s - 4, s*0.35, 4);
      // layers
      for (let i = 0; i < 4; i++) {
        const ly = y + s*(0.35 + i*0.10) + bob;
        const c = i % 2 === 0 ? sp.color1 : sp.color2;
        px(ctx, x+s*0.20, ly, s*0.60, s*0.10, c);
      }
      // top sauce
      px(ctx, x+s*0.20, y+s*0.30+bob, s*0.60, s*0.06, sp.color3);
      // sunglasses
      px(ctx, x+s*0.28, y+s*0.42+bob, s*0.16, s*0.06, "#000");
      px(ctx, x+s*0.56, y+s*0.42+bob, s*0.16, s*0.06, "#000");
      px(ctx, x+s*0.44, y+s*0.43+bob, s*0.12, s*0.02, "#000");
    },
  };

  function drawMon(ctx, speciesId, x, y, size, time) {
    const sp = SPECIES[speciesId];
    if (!sp) return;
    const fn = SPECIAL[speciesId];
    if (fn) {
      fn(ctx, sp, x, y, size, time);
    } else {
      // generic blob fallback
      const bob = Math.sin(time * 0.005) * 1;
      shadow(ctx, x + size/2, y + size - 4, size*0.3, 4);
      px(ctx, x+size*0.25, y+size*0.30+bob, size*0.50, size*0.45, sp.color1);
      px(ctx, x+size*0.30, y+size*0.40+bob, size*0.40, size*0.20, sp.color2);
      px(ctx, x+size*0.34, y+size*0.36+bob, size*0.10, size*0.06, "#fff");
      px(ctx, x+size*0.56, y+size*0.36+bob, size*0.10, size*0.06, "#fff");
      px(ctx, x+size*0.38, y+size*0.38+bob, size*0.04, size*0.04, "#000");
      px(ctx, x+size*0.60, y+size*0.38+bob, size*0.04, size*0.04, "#000");
    }
  }

  // Player overworld sprite (16x16-ish)
  function drawPlayer(ctx, x, y, dir, frame) {
    const s = 16;
    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(x+2, y+s-2, s-4, 2);
    // body
    ctx.fillStyle = "#3a5cff";
    ctx.fillRect(x+4, y+8, 8, 6);
    // head
    ctx.fillStyle = "#ffd9a0";
    ctx.fillRect(x+4, y+2, 8, 6);
    // hat
    ctx.fillStyle = "#cc2222";
    ctx.fillRect(x+3, y+1, 10, 3);
    ctx.fillRect(x+5, y, 6, 2);
    // legs (animate based on frame)
    ctx.fillStyle = "#222244";
    const legOffset = (frame % 2 === 0) ? 0 : 1;
    ctx.fillRect(x+4, y+14, 3, 2);
    ctx.fillRect(x+9, y+14+legOffset, 3, 2);
    // eyes (face direction)
    ctx.fillStyle = "#000";
    if (dir === "down") {
      ctx.fillRect(x+5, y+5, 1, 1);
      ctx.fillRect(x+10, y+5, 1, 1);
    } else if (dir === "up") {
      // none visible
    } else if (dir === "left") {
      ctx.fillRect(x+5, y+5, 1, 1);
    } else if (dir === "right") {
      ctx.fillRect(x+10, y+5, 1, 1);
    }
  }

  // Tile renderer
  const TILE_SIZE = 16;
  function drawTile(ctx, type, x, y, time) {
    switch(type) {
      case 0: // grass
        ctx.fillStyle = "#3aa855";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#2a8845";
        ctx.fillRect(x+2, y+8, 2, 1);
        ctx.fillRect(x+10, y+4, 2, 1);
        ctx.fillRect(x+6, y+12, 2, 1);
        break;
      case 1: // tall grass (encounter)
        ctx.fillStyle = "#2a8845";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#1e6a30";
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(x + 2 + i*5, y + 4, 1, 8);
          ctx.fillRect(x + 4 + i*5, y + 6, 1, 6);
        }
        ctx.fillStyle = "#5cd765";
        ctx.fillRect(x+4, y+10, 1, 2);
        break;
      case 2: // path
        ctx.fillStyle = "#c9a86a";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#a98750";
        ctx.fillRect(x+3, y+5, 1, 1);
        ctx.fillRect(x+11, y+12, 1, 1);
        ctx.fillRect(x+7, y+2, 1, 1);
        break;
      case 3: // wall (tree)
        ctx.fillStyle = "#1e5028";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#3a8a3a";
        ctx.fillRect(x+1, y+1, 14, 14);
        ctx.fillStyle = "#5cd765";
        ctx.fillRect(x+3, y+3, 4, 3);
        ctx.fillRect(x+9, y+5, 3, 3);
        ctx.fillRect(x+5, y+10, 4, 3);
        break;
      case 4: // water
        const wave = Math.floor(time / 300) % 2;
        ctx.fillStyle = "#3a78dc";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#5a98fc";
        ctx.fillRect(x + 2 + wave*4, y + 4, 4, 1);
        ctx.fillRect(x + 8 - wave*4, y + 10, 4, 1);
        break;
      case 5: // building wall
        ctx.fillStyle = "#7a5a4a";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#5a3a2a";
        ctx.fillRect(x, y+8, TILE_SIZE, 1);
        ctx.fillRect(x+8, y, 1, TILE_SIZE);
        break;
      case 6: // door
        ctx.fillStyle = "#3a2218";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#6a3818";
        ctx.fillRect(x+2, y+2, 12, 14);
        ctx.fillStyle = "#ffd700";
        ctx.fillRect(x+11, y+9, 1, 1);
        break;
      case 7: // sign
        ctx.fillStyle = "#3aa855";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#7a5a3a";
        ctx.fillRect(x+3, y+10, 2, 6);
        ctx.fillRect(x+11, y+10, 2, 6);
        ctx.fillStyle = "#c9a86a";
        ctx.fillRect(x+1, y+2, 14, 8);
        ctx.fillStyle = "#3a2218";
        ctx.fillRect(x+3, y+5, 10, 1);
        ctx.fillRect(x+3, y+7, 8, 1);
        break;
      case 8: // healing pad (cappuccino bar floor)
        ctx.fillStyle = "#f5c890";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#c98850";
        ctx.fillRect(x+1, y+1, 14, 1);
        ctx.fillRect(x+1, y+14, 14, 1);
        ctx.fillStyle = "#5a3818";
        ctx.fillRect(x+6, y+6, 4, 4);
        break;
      case 9: // flower
        ctx.fillStyle = "#3aa855";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#ff6b9b";
        ctx.fillRect(x+6, y+6, 4, 4);
        ctx.fillStyle = "#ffe070";
        ctx.fillRect(x+7, y+7, 2, 2);
        break;
      default:
        ctx.fillStyle = "#000";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
    }
  }

  function drawNpc(ctx, x, y, color, frame) {
    const s = 16;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(x+2, y+s-2, s-4, 2);
    // body
    ctx.fillStyle = color;
    ctx.fillRect(x+4, y+8, 8, 6);
    // head
    ctx.fillStyle = "#e0c090";
    ctx.fillRect(x+4, y+2, 8, 6);
    ctx.fillStyle = "#000";
    ctx.fillRect(x+5, y+5, 1, 1);
    ctx.fillRect(x+10, y+5, 1, 1);
    // legs
    ctx.fillStyle = "#222";
    const legOffset = (frame % 2 === 0) ? 0 : 1;
    ctx.fillRect(x+4, y+14, 3, 2);
    ctx.fillRect(x+9, y+14+legOffset, 3, 2);
  }

  return {
    drawMon, drawPlayer, drawTile, drawNpc, TILE_SIZE,
  };
})();

const World = (() => {
  const T = {
    G: 0, // grass
    H: 1, // tall grass (encounter)
    P: 2, // path
    W: 3, // wall (tree)
    R: 4, // water
    B: 5, // building wall
    D: 6, // door
    S: 7, // sign
    F: 8, // healing floor
    L: 9, // flower
  };

  // Map: 30 wide x 22 tall
  // Use chars to make readable
  const RAW_MAP = [
    "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWW",
    "WGGGGGGGGGGGGGWWWWWWWWWWWWWWWW",
    "WGLGLGGGGGGGGGWWGGGGGGGGGGGGGW",
    "WGGGGGGGSGGGGGWGGHHHHHHHHHGGGW",
    "WGGGGGGGPGGGGGGGHHHHHHHHHGGGGW",
    "WGGBBBBBPGGGGGGGGGGGGGGGGGGGGW",
    "WGGBFFFBPGGGGGGGGGGGGGGGGGGGGW",
    "WGGBFFFBPGGGGGGGSGGGHHHHHHHGGW",
    "WGGBFFFDPPPPPPPPPGGGHHHHHHHGGW",
    "WGGBBBBBGGGGGGGGGGGGGGGGGGGGGW",
    "WGGGGGGGPGGGGGGGGGRRRRRGGGGGGW",
    "WGGGGGGGPGHHHHHGGRRRRRRRRGGGGW",
    "WGGGGGGGPGHHHHHGGRRRRRRRRGGGGW",
    "WGGGGGGGPGHHHHHGGGGRRRRRGGGGGW",
    "WGGGGGGGPGGSGGGGGGGGGGGGGGGGGW",
    "WGGGGGGGPGGGGGGGGGGGGGGGGGGGGW",
    "WGGGGGGGPGGGGGGGGGGGGGGGGGGGGW",
    "WGGGGGBBPBBGGGGGGGGGGGGGGGGGGW",
    "WGGGGGBFFFBGGGGGGGGGGGGGGGGGGW",
    "WGGGGGBFFFBGGGGGGGGGGGGGGGGGGW",
    "WGGGGGBBBBBGGGGGGGGGGGGGGGGGGW",
    "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWW",
  ];

  function charToTile(c) {
    return ({
      G: T.G, H: T.H, P: T.P, W: T.W, R: T.R,
      B: T.B, D: T.D, S: T.S, F: T.F, L: T.L,
    })[c] ?? T.G;
  }

  const map = RAW_MAP.map(row => row.split("").map(charToTile));
  const HEIGHT = map.length;
  const WIDTH = map[0].length;
  const TILE = SpriteRenderer.TILE_SIZE;

  // NPCs
  const npcs = [
    {
      id: "rival",
      x: 14, y: 5,
      color: "#ff5e5e",
      facing: "down",
      defeated: false,
      dialog: ["Marco: Hey! You finally have a meme of your own?", "Marco: Let's see if you've got the rizz to back it up!"],
      trainerKey: "RIVAL_1",
      type: "trainer",
    },
    {
      id: "nurse",
      x: 5, y: 7,
      color: "#ff8aa8",
      facing: "down",
      type: "healer",
      dialog: ["Barista: Welcome to the Cappuccino Bar!", "Barista: Your monsters look exhausted... Let me top them up.", "(*HSSSS* — espresso machine sounds)", "Barista: All restored. Ciao!"],
    },
    {
      id: "pasta_chef",
      x: 16, y: 14,
      color: "#ffe070",
      facing: "down",
      defeated: false,
      dialog: ["Luigi: Mamma mia! You smell of fresh meme energy.", "Luigi: My pasta-monsters demand a battle!"],
      trainerKey: "TRAINER_1",
      type: "trainer",
    },
    {
      id: "sigma_bro",
      x: 18, y: 8,
      color: "#9aa5ff",
      facing: "down",
      defeated: false,
      dialog: ["Kai: I don't say hi. I just stare.", "Kai: ...you still here? Fine. Battle me."],
      trainerKey: "TRAINER_2",
      type: "trainer",
    },
    {
      id: "queen",
      x: 8, y: 19,
      color: "#c93dff",
      facing: "down",
      defeated: false,
      dialog: ["Brainrot Queen: You've climbed far, challenger.", "Brainrot Queen: But the deepest lore is mine.", "Brainrot Queen: Tralalero tralala... your final test begins."],
      trainerKey: "GYM_LEADER",
      type: "trainer",
    },
    {
      id: "sign1",
      x: 8, y: 3,
      color: null,
      type: "sign",
      dialog: ["[ROUTE 1]\nWild brain rot lurks in tall grass.\nSay 'tralalero' to befriend them."],
    },
    {
      id: "sign2",
      x: 16, y: 7,
      color: null,
      type: "sign",
      dialog: ["[ROUTE 2]\nDanger Level: VERY 2026.\nLore knowledge required."],
    },
    {
      id: "sign3",
      x: 11, y: 14,
      color: null,
      type: "sign",
      dialog: ["☕ CAPPUCCINO BAR ☕\nFully restores your team.\nFree espresso. We promise."],
    },
  ];

  // Encounter zones: which ENCOUNTER table per region
  function encounterTableAt(tx, ty) {
    if (tx >= 16 && tx <= 24 && ty >= 3 && ty <= 4) return "GRASS_ROUTE_2";
    if (tx >= 16 && tx <= 22 && ty >= 7 && ty <= 8) return "GRASS_ROUTE_2";
    return "GRASS_ROUTE_1";
  }

  function tileAt(x, y) {
    if (x < 0 || y < 0 || x >= WIDTH || y >= HEIGHT) return T.W;
    return map[y][x];
  }

  function isWalkable(x, y) {
    const t = tileAt(x, y);
    if (t === T.W || t === T.R || t === T.B || t === T.S) return false;
    // check NPC collision
    for (const n of npcs) {
      if (n.x === x && n.y === y) return false;
    }
    return true;
  }

  function npcAt(x, y) {
    return npcs.find(n => n.x === x && n.y === y);
  }

  function isEncounterTile(x, y) {
    return tileAt(x, y) === T.H;
  }

  function isHealerTile(x, y) {
    return tileAt(x, y) === T.F;
  }

  // Camera-based draw
  function draw(ctx, cam, time) {
    const startX = Math.max(0, Math.floor(cam.x / TILE));
    const startY = Math.max(0, Math.floor(cam.y / TILE));
    const endX = Math.min(WIDTH, Math.ceil((cam.x + ctx.canvas.width) / TILE));
    const endY = Math.min(HEIGHT, Math.ceil((cam.y + ctx.canvas.height) / TILE));
    for (let y = startY; y < endY; y++) {
      for (let x = startX; x < endX; x++) {
        const sx = x*TILE - cam.x;
        const sy = y*TILE - cam.y;
        SpriteRenderer.drawTile(ctx, map[y][x], sx, sy, time);
      }
    }
    // npcs
    const frame = Math.floor(time / 350);
    for (const n of npcs) {
      if (n.color === null) continue; // signs render as tiles
      const sx = n.x*TILE - cam.x;
      const sy = n.y*TILE - cam.y;
      if (sx < -TILE || sx > ctx.canvas.width || sy < -TILE || sy > ctx.canvas.height) continue;
      SpriteRenderer.drawNpc(ctx, sx, sy, n.color, frame);
    }
  }

  return {
    map, WIDTH, HEIGHT, TILE,
    tileAt, isWalkable, npcAt, isEncounterTile, isHealerTile,
    encounterTableAt, draw, npcs, T,
  };
})();


// ===== js/battle.js =====
// =====================================================
// Battle system - turn based
// =====================================================

const Battle = (() => {
  let state = null;

  const elText = () => document.getElementById("battle-text");
  const elActions = () => document.getElementById("battle-actions");
  const elMoveList = () => document.getElementById("move-list");
  const elBattleUi = () => document.getElementById("battle-ui");
  const elEnemyInfo = () => document.getElementById("enemy-info");
  const elPlayerInfo = () => document.getElementById("player-info");

  function start(playerTeam, opponent, opts = {}) {
    state = {
      playerTeam,
      isTrainer: !!opts.isTrainer,
      trainerName: opts.trainerName || "",
      trainerData: opts.trainerData || null,
      enemyTeam: opts.isTrainer ? opponent : null,
      enemyIdx: 0,
      enemyMon: opts.isTrainer ? opponent[0] : opponent,
      playerIdx: Math.max(0, playerTeam.findIndex(m => m.hp > 0)),
      phase: "intro",
      messageQueue: [],
      message: "",
      onEnd: opts.onEnd || (() => {}),
      caught: false,
      ranAway: false,
      pendingPlayerMove: null,
      pendingEnemyMove: null,
      turnOrder: [],
      turnIdx: 0,
      enemyShake: 0,
      playerShake: 0,
    };
    elBattleUi().classList.remove("hidden");
    elActions().classList.add("hidden");
    elMoveList().classList.add("hidden");
    if (state.isTrainer && state.trainerData) {
      enqueue(state.trainerData.intro);
      enqueue(`${state.trainerData.name} sent out ${SPECIES[state.enemyMon.species].name}!`);
    } else {
      enqueue(`A wild ${SPECIES[state.enemyMon.species].name} appeared!`);
    }
    enqueue(`Go, ${SPECIES[playerMon().species].name}!`);
    state.phase = "intro";
    nextMessage();
    refreshInfo();
  }

  function playerMon() { return state.playerTeam[state.playerIdx]; }

  function enqueue(msg) { state.messageQueue.push(msg); }

  function nextMessage() {
    if (!state) return;
    if (state.messageQueue.length === 0) {
      state.message = "";
      onMessageEnd();
      return;
    }
    state.message = state.messageQueue.shift();
    elText().innerHTML = state.message;
    elActions().classList.add("hidden");
    elMoveList().classList.add("hidden");
    refreshInfo();
  }

  function onMessageEnd() {
    if (!state) return;
    refreshInfo();
    switch (state.phase) {
      case "intro":
        state.phase = "menu";
        showActions();
        break;
      case "midTurn":
        // check faints
        if (state.enemyMon.hp <= 0) { handleEnemyFaint(); return; }
        if (playerMon().hp <= 0) { handlePlayerFaint(); return; }
        // continue turn order
        doNextTurnAction();
        break;
      case "endTurn":
        state.phase = "menu";
        showActions();
        break;
      case "trainerSwap":
        state.phase = "menu";
        showActions();
        break;
      case "playerSwap":
        state.phase = "menu";
        showActions();
        break;
      case "wonBattle":
      case "lostBattle":
      case "ranAway":
      case "caughtMon":
        finish();
        break;
      default:
        break;
    }
  }

  function showActions() {
    if (!state) return;
    elText().innerHTML = `What will <b>${SPECIES[playerMon().species].name}</b> do?`;
    elActions().classList.remove("hidden");
    elMoveList().classList.add("hidden");
  }

  function showMoves() {
    const html = playerMon().moves.map((m, i) => {
      const mv = MOVES[m.id];
      return `<button data-move="${i}">${mv.name}<br><small>${mv.type} · ${m.pp}/${m.maxPp}</small></button>`;
    }).join("");
    elMoveList().innerHTML = html + `<button data-move="back">↩ BACK</button>`;
    elActions().classList.add("hidden");
    elMoveList().classList.remove("hidden");
  }

  function handleAction(action) {
    if (!state || state.phase !== "menu") return;
    if (action === "fight") showMoves();
    else if (action === "bag") throwBraincell();
    else if (action === "team") swapTeam();
    else if (action === "run") attemptRun();
  }

  function handleMove(idx) {
    if (!state) return;
    if (idx === "back") { showActions(); return; }
    const slot = playerMon().moves[+idx];
    if (!slot) return;
    if (slot.pp <= 0) {
      enqueue("No PP left for that move!");
      state.phase = "endTurn";
      nextMessage();
      return;
    }
    state.pendingPlayerMove = slot;
    state.pendingEnemyMove = pickEnemyMove();
    const playerSpd = getStat(playerMon(), "spd");
    const enemySpd = getStat(state.enemyMon, "spd");
    const playerFirst = playerSpd >= enemySpd
      ? true
      : (playerSpd === enemySpd ? Math.random() < 0.5 : false);
    state.turnOrder = playerFirst ? ["player", "enemy"] : ["enemy", "player"];
    state.turnIdx = 0;
    elActions().classList.add("hidden");
    elMoveList().classList.add("hidden");
    doNextTurnAction();
  }

  function doNextTurnAction() {
    if (!state) return;
    if (state.turnIdx >= state.turnOrder.length) {
      state.phase = "endTurn";
      onMessageEnd();
      return;
    }
    const who = state.turnOrder[state.turnIdx++];
    if (who === "player") {
      if (playerMon().hp <= 0) { doNextTurnAction(); return; }
      executeMove(playerMon(), state.enemyMon, state.pendingPlayerMove, true);
    } else {
      if (state.enemyMon.hp <= 0) { doNextTurnAction(); return; }
      executeMove(state.enemyMon, playerMon(), state.pendingEnemyMove, false);
    }
    state.phase = "midTurn";
    nextMessage();
  }

  function executeMove(attacker, defender, moveSlot, isPlayer) {
    moveSlot.pp = Math.max(0, moveSlot.pp - 1);
    const move = MOVES[moveSlot.id];
    enqueue(`${SPECIES[attacker.species].name} used ${move.name}!`);
    if (Math.random() > move.acc / 100) {
      enqueue("...but it missed!");
      return;
    }
    if (move.cat === "status") {
      applyStatus(attacker, defender, move);
      return;
    }
    const dmg = computeDamage(attacker, defender, move);
    defender.hp = Math.max(0, defender.hp - dmg.amount);
    if (isPlayer) state.enemyShake = 8;
    else state.playerShake = 8;
    if (dmg.crit) enqueue("Critical rizz!");
    if (dmg.eff > 1) enqueue("It's super 2026 effective!");
    else if (dmg.eff < 1 && dmg.eff > 0) enqueue("It's not very brainrot...");
    else if (dmg.eff === 0) enqueue(`It doesn't affect ${SPECIES[defender.species].name}...`);
  }

  function applyStatus(attacker, defender, move) {
    if (move.status === "atk_down") {
      defender.statBoosts.atk = Math.max(-6, (defender.statBoosts.atk || 0) - 1);
      enqueue(`${SPECIES[defender.species].name}'s attack fell!`);
    } else if (move.status === "confuse") {
      defender.statusEffect = "confused";
      enqueue(`${SPECIES[defender.species].name} became confused!`);
    } else if (move.status === "heal") {
      const healed = Math.min(attacker.maxHp - attacker.hp, Math.floor(attacker.maxHp / 2));
      attacker.hp += healed;
      enqueue(`${SPECIES[attacker.species].name} sipped cappuccino. Restored ${healed} HP!`);
    }
  }

  function computeDamage(attacker, defender, move) {
    const atkSp = SPECIES[attacker.species];
    const defSp = SPECIES[defender.species];
    const atkStat = getStat(attacker, "atk");
    const defStat = getStat(defender, "def");
    const stab = atkSp.types.includes(move.type) ? 1.5 : 1;
    const eff = typeEffectiveness(move.type, defSp.types);
    const crit = Math.random() < 0.0625 ? 1.5 : 1;
    const rand = 0.85 + Math.random() * 0.15;
    let amount = (((2 * attacker.level) / 5 + 2) * move.power * (atkStat / Math.max(1, defStat))) / 50 + 2;
    amount = Math.floor(amount * stab * eff * crit * rand);
    if (eff === 0) amount = 0;
    return { amount, eff, crit: crit > 1 };
  }

  function pickEnemyMove() {
    const moves = state.enemyMon.moves.filter(m => m.pp > 0);
    if (moves.length === 0) return { id: "TACKLE", pp: 99, maxPp: 99 };
    return moves[Math.floor(Math.random() * moves.length)];
  }

  function handleEnemyFaint() {
    enqueue(`${SPECIES[state.enemyMon.species].name} fainted!`);
    const expGain = computeExp(state.enemyMon);
    enqueue(`${SPECIES[playerMon().species].name} gained ${expGain} XP!`);
    grantXp(playerMon(), expGain);
    if (state.isTrainer) {
      const next = state.enemyTeam.findIndex((m, i) => i > state.enemyIdx && m.hp > 0);
      if (next >= 0) {
        state.enemyIdx = next;
        state.enemyMon = state.enemyTeam[next];
        enqueue(`${state.trainerData.name} sent out ${SPECIES[state.enemyMon.species].name}!`);
        state.phase = "trainerSwap";
      } else {
        enqueue(state.trainerData.defeat);
        enqueue(`You defeated ${state.trainerData.name}!`);
        state.phase = "wonBattle";
      }
    } else {
      state.phase = "wonBattle";
    }
    nextMessage();
  }

  function handlePlayerFaint() {
    enqueue(`${SPECIES[playerMon().species].name} fainted!`);
    const next = state.playerTeam.findIndex(m => m.hp > 0);
    if (next < 0) {
      enqueue("You have no monsters left!");
      enqueue("You scurried back home, humiliated.");
      state.phase = "lostBattle";
    } else {
      state.playerIdx = next;
      enqueue(`Go, ${SPECIES[playerMon().species].name}!`);
      state.phase = "playerSwap";
    }
    nextMessage();
  }

  function computeExp(defeated) {
    const sp = SPECIES[defeated.species];
    return Math.floor(((sp.xpYield || 60) * defeated.level) / 7);
  }

  function grantXp(mon, amount) {
    mon.xp += amount;
    while (mon.level < 50) {
      const needed = xpForLevel(mon.level + 1);
      if (mon.xp >= needed) levelUp(mon);
      else break;
    }
  }

  function levelUp(mon) {
    const sp = SPECIES[mon.species];
    const oldMax = mon.maxHp;
    mon.level++;
    mon.maxHp = maxHp(sp, mon.level);
    mon.hp += (mon.maxHp - oldMax);
    enqueue(`${SPECIES[mon.species].name} grew to Lv. ${mon.level}!`);
    for (const moveId of movesLearnedAt(sp, mon.level)) {
      if (mon.moves.find(m => m.id === moveId)) continue;
      if (mon.moves.length < 4) {
        mon.moves.push({ id: moveId, pp: MOVES[moveId].pp, maxPp: MOVES[moveId].pp });
        enqueue(`${SPECIES[mon.species].name} learned ${MOVES[moveId].name}!`);
      } else {
        const old = mon.moves[3];
        mon.moves[3] = { id: moveId, pp: MOVES[moveId].pp, maxPp: MOVES[moveId].pp };
        enqueue(`${SPECIES[mon.species].name} forgot ${MOVES[old.id].name} and learned ${MOVES[moveId].name}!`);
      }
    }
    if (sp.evolvesAt && mon.level >= sp.evolvesAt && sp.evolvesTo) {
      const newSp = SPECIES[sp.evolvesTo];
      enqueue(`What?! ${SPECIES[mon.species].name} is evolving!`);
      mon.species = sp.evolvesTo;
      mon.maxHp = maxHp(newSp, mon.level);
      mon.hp = mon.maxHp;
      enqueue(`${SPECIES[mon.species].name} evolved into ${newSp.name}!`);
    }
  }

  function attemptRun() {
    if (state.isTrainer) {
      enqueue("You can't run from a trainer battle!");
      enemyFreeTurn();
      return;
    }
    const ps = getStat(playerMon(), "spd");
    const es = getStat(state.enemyMon, "spd");
    const odds = (ps * 32) / Math.max(1, Math.floor(es / 4)) + 30;
    if (Math.random() * 256 < odds) {
      enqueue("Got away safely!");
      state.ranAway = true;
      state.phase = "ranAway";
      nextMessage();
    } else {
      enqueue("Couldn't escape!");
      enemyFreeTurn();
    }
  }

  // Player did something non-combat (item, swap, failed run); enemy gets free turn.
  function enemyFreeTurn() {
    state.pendingPlayerMove = null;
    state.pendingEnemyMove = pickEnemyMove();
    state.turnOrder = ["enemy"];
    state.turnIdx = 0;
    doNextTurnAction();
  }

  function throwBraincell() {
    if (state.isTrainer) {
      enqueue("That trainer would block your brain cells!");
      state.phase = "endTurn";
      nextMessage();
      return;
    }
    if (!game_bag_consume("BRAINCELL")) {
      enqueue("You're out of Brain Cells!");
      state.phase = "endTurn";
      nextMessage();
      return;
    }
    enqueue(`You hurled a Brain Cell!`);
    const sp = SPECIES[state.enemyMon.species];
    const catchRate = sp.catchRate || 50;
    const a = ((3 * state.enemyMon.maxHp - 2 * state.enemyMon.hp) * catchRate) / (3 * state.enemyMon.maxHp);
    let success = Math.random() * 255 < a;
    if (sp.legendary && Math.random() < 0.7) success = false;
    if (success) {
      enqueue(`Gotcha! ${sp.name} was caught!`);
      state.caught = true;
      state.phase = "caughtMon";
      nextMessage();
    } else {
      const shakes = Math.max(1, Math.min(3, Math.floor((a / 255) * 4)));
      enqueue(`(*${"shake ".repeat(shakes).trim()}*) ${sp.name} broke free!`);
      enemyFreeTurn();
    }
  }

  // bag is owned by game.js — this is a hook the game can override
  function game_bag_consume(itemKey) {
    if (typeof window.__brainrotBagConsume === "function") {
      return window.__brainrotBagConsume(itemKey);
    }
    return true;
  }

  function swapTeam() {
    const team = state.playerTeam;
    let idx = -1;
    for (let i = 1; i < team.length; i++) {
      const k = (state.playerIdx + i) % team.length;
      if (team[k].hp > 0 && k !== state.playerIdx) { idx = k; break; }
    }
    if (idx < 0) {
      enqueue("No other monsters can fight!");
      state.phase = "endTurn";
      nextMessage();
      return;
    }
    enqueue(`Come back, ${SPECIES[playerMon().species].name}!`);
    state.playerIdx = idx;
    enqueue(`Go, ${SPECIES[playerMon().species].name}!`);
    enemyFreeTurn();
  }

  function refreshInfo() {
    if (!state) return;
    const e = state.enemyMon;
    const eSp = SPECIES[e.species];
    elEnemyInfo().querySelector(".mon-name").textContent = eSp.name;
    elEnemyInfo().querySelector(".mon-lvl").textContent = "Lv. " + e.level;
    const eRatio = e.hp / e.maxHp;
    const eFill = elEnemyInfo().querySelector(".hp-fill");
    eFill.style.width = (eRatio * 100) + "%";
    eFill.classList.toggle("med", eRatio < 0.5 && eRatio >= 0.2);
    eFill.classList.toggle("low", eRatio < 0.2);

    const p = playerMon();
    const pSp = SPECIES[p.species];
    elPlayerInfo().querySelector(".mon-name").textContent = pSp.name;
    elPlayerInfo().querySelector(".mon-lvl").textContent = "Lv. " + p.level;
    const pRatio = p.hp / p.maxHp;
    const pFill = elPlayerInfo().querySelector(".hp-fill");
    pFill.style.width = (pRatio * 100) + "%";
    pFill.classList.toggle("med", pRatio < 0.5 && pRatio >= 0.2);
    pFill.classList.toggle("low", pRatio < 0.2);
    elPlayerInfo().querySelector(".hp-text").textContent = `${p.hp} / ${p.maxHp}`;

    const xpBase = xpForLevel(p.level);
    const xpNext = xpForLevel(p.level + 1);
    const xpRatio = (p.xp - xpBase) / Math.max(1, xpNext - xpBase);
    elPlayerInfo().querySelector(".xp-fill").style.width = Math.min(1, Math.max(0, xpRatio)) * 100 + "%";
  }

  function finish() {
    elBattleUi().classList.add("hidden");
    elActions().classList.add("hidden");
    elMoveList().classList.add("hidden");
    const cb = state.onEnd;
    const result = {
      caught: state.caught,
      ranAway: state.ranAway,
      defeatedTrainer: state.isTrainer && (!state.enemyTeam || state.enemyTeam.every(m => m.hp <= 0)),
      enemyMon: state.enemyMon,
    };
    state = null;
    cb(result);
  }

  function draw(ctx, time) {
    if (!state) return;
    const W = ctx.canvas.width, H = ctx.canvas.height;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#5b2d8c");
    grad.addColorStop(0.7, "#2a8c4a");
    grad.addColorStop(1, "#4a3a2a");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // platforms
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(W*0.25, H*0.78, 80, 12, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(W*0.78, H*0.40, 65, 10, 0, 0, Math.PI*2);
    ctx.fill();

    const eShakeX = state.enemyShake > 0 ? (Math.random()*4-2) : 0;
    if (state.enemyShake > 0) state.enemyShake--;
    SpriteRenderer.drawMon(ctx, state.enemyMon.species, W*0.78 - 48 + eShakeX, H*0.18, 96, time);

    const pShakeX = state.playerShake > 0 ? (Math.random()*4-2) : 0;
    if (state.playerShake > 0) state.playerShake--;
    SpriteRenderer.drawMon(ctx, playerMon().species, W*0.25 - 64 + pShakeX, H*0.55, 128, time);
  }

  function handleKey(key) {
    if (!state) return false;
    if (state.phase === "menu") {
      if (key === "z" || key === "Enter") { handleAction("fight"); return true; }
      if (key === "x") { handleAction("run"); return true; }
      return true;
    }
    // any message-driven phase: advance on Z/Enter/space
    if (key === "z" || key === "Enter" || key === " ") {
      nextMessage();
      return true;
    }
    return true;
  }

  function isActive() { return state !== null; }

  return {
    start, draw, handleKey, isActive, handleAction, handleMove, refreshInfo,
  };
})();


// ===== js/game.js =====
// =====================================================
// Main game loop, input, state management
// =====================================================

(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  // Game state
  const game = {
    mode: "title", // title | starter | overworld | battle | dialog | menu
    player: {
      tileX: 8,
      tileY: 16,
      pixelX: 8 * 16,
      pixelY: 16 * 16,
      facing: "down",
      moving: false,
      moveProgress: 0,
      moveSpeed: 6, // pixels per frame
      animFrame: 0,
      stepCounter: 0,
    },
    team: [],
    box: [], // overflow caught monsters
    bag: { BRAINCELL: 8, GREATCELL: 2, CAPPUCCINO: 3 },
    cam: { x: 0, y: 0 },
    inputs: {},
    dialog: null,
    starterIdx: 0,
    queueAfterDialog: null,
    encounterCooldown: 0,
    flashTime: 0,
    badges: 0,
  };

  // ----- Input -----
  const keys = {};
  window.addEventListener("keydown", (e) => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Enter","z","x","Z","X"].includes(e.key)) {
      e.preventDefault();
    }
    keys[e.key] = true;
    onKeyDown(e.key);
  });
  window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
  });

  // touch buttons
  document.querySelectorAll("#touch-controls button").forEach(btn => {
    const k = btn.dataset.key;
    const press = (e) => { e.preventDefault(); keys[k] = true; onKeyDown(k); };
    const release = (e) => { e.preventDefault(); keys[k] = false; };
    btn.addEventListener("touchstart", press);
    btn.addEventListener("touchend", release);
    btn.addEventListener("mousedown", press);
    btn.addEventListener("mouseup", release);
    btn.addEventListener("mouseleave", release);
  });

  // battle ui buttons
  document.querySelectorAll("#battle-actions button").forEach(btn => {
    btn.addEventListener("click", () => Battle.handleAction(btn.dataset.action));
  });
  document.getElementById("move-list").addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON") {
      Battle.handleMove(e.target.dataset.move);
    }
  });

  // tap title
  document.getElementById("title-screen").addEventListener("click", () => {
    if (game.mode === "title") startGame();
  });

  function onKeyDown(key) {
    if (game.mode === "title") {
      if (key === "Enter" || key === "z" || key === " ") startGame();
      return;
    }
    if (game.mode === "starter") {
      if (key === "ArrowLeft") cycleStarter(-1);
      else if (key === "ArrowRight") cycleStarter(1);
      else if (key === "Enter" || key === "z") confirmStarter();
      return;
    }
    if (game.mode === "battle") {
      Battle.handleKey(key);
      return;
    }
    if (game.mode === "dialog") {
      if (key === "z" || key === "Enter" || key === " ") advanceDialog();
      return;
    }
    if (game.mode === "menu") {
      if (key === "x" || key === "Escape") closeMenu();
      else if (key === "ArrowUp") menuMove(-1);
      else if (key === "ArrowDown") menuMove(1);
      else if (key === "Enter" || key === "z") menuSelect();
      return;
    }
    if (game.mode === "overworld") {
      if (key === "x" || key === "Escape") openMenu();
      else if (key === "z" || key === "Enter") interact();
    }
  }

  // ----- Title / starter -----
  function startGame() {
    document.getElementById("title-screen").classList.add("hidden");
    // show touch ctrls if mobile
    const isTouch = matchMedia("(pointer: coarse)").matches;
    if (isTouch) document.getElementById("touch-controls").classList.remove("hidden");

    // load save?
    if (loadSave()) {
      game.mode = "overworld";
      showDialog([`Welcome back!\nYou have ${game.team.length} monsters in your team.`], () => {});
      return;
    }
    game.mode = "starter";
    game.starterIdx = 0;
    showDialog([
      "PROFESSOR PARMIGIANO:",
      "Ah! A new challenger! In this world, brain rot creatures roam the lands.",
      "Capture them. Train them. Defeat the Brainrot Queen.",
      "Pick your starter, my dear traveler:",
    ], () => {
      game.mode = "starter";
    });
  }

  const STARTERS = ["TRALALERO", "BOMBARDINO", "TUNGTUNG"];
  const STARTER_INFO = {
    TRALALERO: "Water/Beast — speedy attacker.",
    BOMBARDINO: "Fire/Air — heavy hitter.",
    TUNGTUNG: "Beast/Brainrot — defensive bruiser.",
  };

  function cycleStarter(d) {
    game.starterIdx = (game.starterIdx + d + STARTERS.length) % STARTERS.length;
  }

  function confirmStarter() {
    const id = STARTERS[game.starterIdx];
    const mon = makeMon(id, 5);
    game.team.push(mon);
    game.mode = "dialog";
    showDialog([
      `You chose ${SPECIES[id].name}!`,
      `"${SPECIES[id].flavor}"`,
      "Professor: Now go! And remember — when in doubt, say 'tralalero'.",
    ], () => {
      game.mode = "overworld";
      saveGame();
    });
  }

  // ----- Dialog -----
  function showDialog(lines, onEnd) {
    game.mode = "dialog";
    game.dialog = { lines: [...lines], idx: 0, onEnd: onEnd || (() => {}) };
    const el = document.getElementById("dialog");
    el.classList.remove("hidden");
    document.getElementById("dialog-text").innerHTML = lines[0];
  }

  function advanceDialog() {
    if (!game.dialog) return;
    game.dialog.idx++;
    if (game.dialog.idx >= game.dialog.lines.length) {
      const cb = game.dialog.onEnd;
      game.dialog = null;
      document.getElementById("dialog").classList.add("hidden");
      cb();
      if (game.mode === "dialog") game.mode = "overworld";
    } else {
      document.getElementById("dialog-text").innerHTML = game.dialog.lines[game.dialog.idx];
    }
  }

  // ----- Menu -----
  let menuState = null;
  function openMenu() {
    menuState = {
      items: ["TEAM", "BAG", "SAVE", "CLOSE"],
      idx: 0,
    };
    game.mode = "menu";
    renderMenu();
    document.getElementById("menu").classList.remove("hidden");
  }
  function closeMenu() {
    document.getElementById("menu").classList.add("hidden");
    menuState = null;
    game.mode = "overworld";
  }
  function menuMove(d) {
    if (!menuState) return;
    menuState.idx = (menuState.idx + d + menuState.items.length) % menuState.items.length;
    renderMenu();
  }
  function renderMenu() {
    const ul = document.getElementById("menu-list");
    ul.innerHTML = menuState.items.map((it, i) =>
      `<li class="${i === menuState.idx ? "selected" : ""}">${it}</li>`
    ).join("");
  }
  function menuSelect() {
    const choice = menuState.items[menuState.idx];
    if (choice === "CLOSE") { closeMenu(); return; }
    if (choice === "SAVE") {
      saveGame();
      closeMenu();
      showDialog(["Game saved successfully!"], () => {});
      return;
    }
    if (choice === "TEAM") {
      closeMenu();
      const lines = game.team.length === 0 ? ["You have no monsters."] :
        game.team.map(m => {
          const sp = SPECIES[m.species];
          return `${sp.name} Lv.${m.level} HP:${m.hp}/${m.maxHp}\nMoves: ${m.moves.map(mv => MOVES[mv.id].name).join(", ")}`;
        });
      showDialog(lines, () => {});
      return;
    }
    if (choice === "BAG") {
      closeMenu();
      const lines = Object.entries(game.bag).map(([k, v]) =>
        `${ITEMS[k].name} x${v}\n${ITEMS[k].desc}`
      );
      showDialog(lines.length ? lines : ["Bag is empty."], () => {});
      return;
    }
  }

  // ----- Overworld interaction -----
  function interact() {
    const p = game.player;
    let tx = p.tileX, ty = p.tileY;
    if (p.facing === "up") ty--;
    else if (p.facing === "down") ty++;
    else if (p.facing === "left") tx--;
    else if (p.facing === "right") tx++;
    const npc = World.npcAt(tx, ty);
    if (npc) {
      if (npc.type === "trainer") {
        if (npc.defeated) {
          showDialog([`${npc.dialog[0].split(":")[0]}: I have been bested. Move along.`], () => {});
          return;
        }
        showDialog(npc.dialog, () => {
          startTrainerBattle(npc);
        });
      } else if (npc.type === "healer") {
        showDialog(npc.dialog, () => {
          for (const m of game.team) {
            m.hp = m.maxHp;
            for (const mv of m.moves) mv.pp = mv.maxPp;
          }
          saveGame();
        });
      } else if (npc.type === "sign") {
        showDialog(npc.dialog, () => {});
      } else {
        showDialog(npc.dialog || ["..."], () => {});
      }
    }
  }

  function startTrainerBattle(npc) {
    const data = TRAINERS[npc.trainerKey];
    const team = data.team.map(({id, lvl}) => makeMon(id, lvl));
    game.mode = "battle";
    Battle.start(game.team, team, {
      isTrainer: true,
      trainerName: data.name,
      trainerData: data,
      onEnd: (result) => {
        if (result.defeatedTrainer) {
          npc.defeated = true;
          if (npc.trainerKey === "GYM_LEADER") {
            game.badges++;
            showDialog([
              "You defeated the Brainrot Queen!",
              "You receive the BRAINROT BADGE.",
              "...The credits would roll, but the lore continues. Train more!",
            ], () => {});
          }
        }
        game.mode = "overworld";
        saveGame();
      },
    });
  }

  function startWildBattle() {
    const tableId = World.encounterTableAt(game.player.tileX, game.player.tileY);
    const table = ENCOUNTERS[tableId];
    const total = table.reduce((s, e) => s + e.weight, 0);
    let r = Math.random() * total;
    let chosen = table[0];
    for (const e of table) { r -= e.weight; if (r <= 0) { chosen = e; break; } }
    const lvl = chosen.minLvl + Math.floor(Math.random() * (chosen.maxLvl - chosen.minLvl + 1));
    const enemy = makeMon(chosen.id, lvl);
    game.mode = "battle";
    game.flashTime = 12;
    Battle.start(game.team, enemy, {
      isTrainer: false,
      onEnd: (result) => {
        if (result.caught) {
          if (game.team.length < 6) game.team.push(result.enemyMon);
          else game.box.push(result.enemyMon);
        }
        game.mode = "overworld";
        saveGame();
      },
    });
  }

  // ----- Movement -----
  function tryStartMove() {
    const p = game.player;
    if (p.moving) return;
    let dx = 0, dy = 0, facing = p.facing;
    if (keys["ArrowUp"]) { dy = -1; facing = "up"; }
    else if (keys["ArrowDown"]) { dy = 1; facing = "down"; }
    else if (keys["ArrowLeft"]) { dx = -1; facing = "left"; }
    else if (keys["ArrowRight"]) { dx = 1; facing = "right"; }
    else return;
    p.facing = facing;
    const nx = p.tileX + dx, ny = p.tileY + dy;
    if (!World.isWalkable(nx, ny)) {
      // bonk - can still face that way
      return;
    }
    p.targetX = nx;
    p.targetY = ny;
    p.moving = true;
    p.moveProgress = 0;
    p.dx = dx;
    p.dy = dy;
  }

  function updateMovement() {
    const p = game.player;
    if (!p.moving) return;
    p.moveProgress += p.moveSpeed;
    p.pixelX = p.tileX * 16 + p.dx * p.moveProgress;
    p.pixelY = p.tileY * 16 + p.dy * p.moveProgress;
    if (p.moveProgress >= 16) {
      p.tileX = p.targetX;
      p.tileY = p.targetY;
      p.pixelX = p.tileX * 16;
      p.pixelY = p.tileY * 16;
      p.moving = false;
      p.stepCounter++;
      p.animFrame = (p.animFrame + 1) % 2;
      // trigger encounter?
      if (World.isEncounterTile(p.tileX, p.tileY)) {
        if (game.encounterCooldown <= 0 && Math.random() < 0.10) {
          game.encounterCooldown = 4;
          startWildBattle();
          return;
        }
      }
      // healing tile
      if (World.isHealerTile(p.tileX, p.tileY)) {
        // do nothing; healing happens through nurse interaction
      }
      if (game.encounterCooldown > 0) game.encounterCooldown--;
    }
  }

  // ----- Camera -----
  function updateCamera() {
    const p = game.player;
    const W = canvas.width, H = canvas.height;
    let cx = p.pixelX + 8 - W / 2;
    let cy = p.pixelY + 8 - H / 2;
    cx = Math.max(0, Math.min(World.WIDTH * 16 - W, cx));
    cy = Math.max(0, Math.min(World.HEIGHT * 16 - H, cy));
    game.cam.x = cx;
    game.cam.y = cy;
  }

  // ----- Save / Load -----
  function saveGame() {
    const data = {
      team: game.team,
      box: game.box,
      bag: game.bag,
      player: { tileX: game.player.tileX, tileY: game.player.tileY, facing: game.player.facing },
      badges: game.badges,
      defeated: World.npcs.filter(n => n.defeated).map(n => n.id),
    };
    try { localStorage.setItem("brainrot_save_v1", JSON.stringify(data)); } catch(e) {}
  }
  function loadSave() {
    try {
      const raw = localStorage.getItem("brainrot_save_v1");
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data.team || data.team.length === 0) return false;
      game.team = data.team;
      game.box = data.box || [];
      game.bag = data.bag || { BRAINCELL: 8 };
      game.player.tileX = data.player.tileX;
      game.player.tileY = data.player.tileY;
      game.player.pixelX = game.player.tileX * 16;
      game.player.pixelY = game.player.tileY * 16;
      game.player.facing = data.player.facing || "down";
      game.badges = data.badges || 0;
      const defeatedIds = data.defeated || [];
      for (const n of World.npcs) if (defeatedIds.includes(n.id)) n.defeated = true;
      return true;
    } catch(e) { return false; }
  }

  // expose for debugging
  window.__brainrot = { game, saveGame, loadSave, World, SPECIES, makeMon };

  // Hook used by battle to consume items
  window.__brainrotBagConsume = function(itemKey) {
    if ((game.bag[itemKey] || 0) <= 0) return false;
    game.bag[itemKey]--;
    return true;
  };

  // ----- Render starter screen -----
  function drawStarterScreen(time) {
    ctx.fillStyle = "#0d0d18";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // title
    ctx.fillStyle = "#ffcb05";
    ctx.font = "bold 14px Courier New";
    ctx.textAlign = "center";
    ctx.fillText("CHOOSE YOUR STARTER", canvas.width/2, 28);
    // mons
    const slots = [
      { x: canvas.width/2 - 160 },
      { x: canvas.width/2 - 48 },
      { x: canvas.width/2 + 64 },
    ];
    for (let i = 0; i < STARTERS.length; i++) {
      const s = slots[i];
      const isSel = i === game.starterIdx;
      if (isSel) {
        ctx.fillStyle = "rgba(255,203,5,0.2)";
        ctx.fillRect(s.x - 8, 50, 112, 112);
        ctx.strokeStyle = "#ffcb05";
        ctx.lineWidth = 2;
        ctx.strokeRect(s.x - 8, 50, 112, 112);
      }
      SpriteRenderer.drawMon(ctx, STARTERS[i], s.x, 60, 96, time);
    }
    // info
    ctx.fillStyle = "#fff";
    ctx.font = "10px Courier New";
    const sel = STARTERS[game.starterIdx];
    ctx.fillText(SPECIES[sel].name, canvas.width/2, 190);
    ctx.fillStyle = "#ffd";
    const flavor = SPECIES[sel].flavor;
    wrapText(ctx, flavor, canvas.width/2, 210, 360, 12);
    ctx.fillStyle = "#cfe9ff";
    wrapText(ctx, STARTER_INFO[sel], canvas.width/2, 250, 360, 12);
    ctx.fillStyle = "#aaa";
    ctx.fillText("◀ ▶ to choose · Z / Enter to confirm", canvas.width/2, 295);
  }

  function wrapText(ctx, text, x, y, maxW, lh) {
    const words = text.split(" ");
    let line = "";
    let yy = y;
    for (const w of words) {
      const test = line + w + " ";
      if (ctx.measureText(test).width > maxW) {
        ctx.fillText(line, x, yy);
        line = w + " ";
        yy += lh;
      } else line = test;
    }
    ctx.fillText(line, x, yy);
  }

  // ----- Main loop -----
  let lastTime = 0;
  function loop(t) {
    const dt = t - lastTime;
    lastTime = t;
    update(t);
    render(t);
    requestAnimationFrame(loop);
  }

  function update(time) {
    if (game.mode === "overworld") {
      tryStartMove();
      updateMovement();
      updateCamera();
    }
    if (game.flashTime > 0) game.flashTime--;
  }

  function render(time) {
    if (game.mode === "title") return; // overlay handles it
    if (game.mode === "starter") {
      drawStarterScreen(time);
      return;
    }
    if (game.mode === "battle") {
      Battle.draw(ctx, time);
      Battle.refreshInfo();
      return;
    }
    // overworld / dialog / menu
    World.draw(ctx, game.cam, time);
    // player
    SpriteRenderer.drawPlayer(
      ctx,
      game.player.pixelX - game.cam.x,
      game.player.pixelY - game.cam.y,
      game.player.facing,
      game.player.animFrame
    );
    if (game.flashTime > 0) {
      ctx.fillStyle = `rgba(255,255,255,${game.flashTime / 12})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    // hud minicorner
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(4, 4, 108, 16);
    ctx.fillStyle = "#fff";
    ctx.font = "10px Courier New";
    ctx.textAlign = "left";
    ctx.fillText(`Team:${game.team.length}/6  Badge:${game.badges}`, 8, 16);
  }

  requestAnimationFrame(loop);
})();

  </script>
